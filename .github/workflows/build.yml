name: Marketplace build
on:
  push:
    branches: [main, feat/marketplace-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        run: npm run build
      - name: Package Hostinger deployment ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git archive --format=zip --output=sellfastdeploy.zip HEAD
      - name: Upload Hostinger deployment ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sellfastdeploy
          path: sellfastdeploy.zip
          if-no-files-found: error
          retention-days: 7
